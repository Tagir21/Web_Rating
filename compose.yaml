name: web-rating

services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s


  db-init:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    command:
      [
        "python",
        "-c",
        "import asyncio; from rating_site.backend.db_conn import setup_grades; asyncio.run(setup_grades())"
      ]

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.docker

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "rating_site.backend.server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    depends_on:
      db-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.docker

    command:
      [
        "python",
        "-m",
        "rating_site.manage",
        "runserver",
        "0.0.0.0:8001"
      ]

    ports:
      - "8001:8001"

    volumes:
      - ./data:/app/data
      - ./rating_site/db.sqlite3:/app/rating_site/db.sqlite3

    depends_on:
      db-init:
        condition: service_completed_successfully

      api:
        condition: service_healthy


  bot:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.docker

    command:
      [
        "python",
        "-m",
        "rating_site.tg_bot.bot"
      ]

    volumes:
      - ./data:/app/data

    depends_on:
      db-init:
        condition: service_completed_successfully


volumes:
  mysql_data: