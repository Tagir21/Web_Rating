{% load static %}

<!doctype html>
<html lang=ru>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background-color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #ffffff;
        }

        .login-box {
            width: 100%;
            max-width: 480px;
        }

        .login-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .login-logo {
            height: 56px;
            width: 56px;
            object-fit: contain;
            border-radius: 12px;
            background-color: #f8f9fa;
            padding: 4px;
            border: 1px solid #dee2e6;
            transition: transform 0.2s ease;
        }

        .login-logo:hover {
            transform: scale(1.05);
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-card-body {
            padding: 40px;
            background-color: #ffffff;
            border-radius: 24px;
        }

        .form-control {
            border: 1px solid #ced4da;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        @media (max-width: 576px) {
            .login-card-body {
                padding: 28px 22px;
            }

            .login-header {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="login-page">
        <div class="login-box">

            <div class="login-header">
                <div>
                    <h2 class="fw-bold mb-1">Вход в систему</h2>
                    <p class="text-muted mb-0">Войдите в свой аккаунт</p>
                </div>

                <div class="flex-shrink-0 ms-3">
                    <img src="{% static 'img/logo.png' %}" alt="Логотип" class="login-logo">
                </div>
            </div>

            <div class="login-card">
                <div class="login-card-body">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person"></i> Логин
                            </label>

                            <input type="text"
                                   class="form-control form-control-lg rounded-3"
                                   id="username"
                                   name="username"
                                   required
                                   autocomplete="username"
                                   placeholder="Введите логин">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">
                                <i class="bi bi-lock"></i> Пароль
                            </label>

                            <input type="password"
                                   class="form-control form-control-lg rounded-3"
                                   id="password"
                                   name="password"
                                   required
                                   autocomplete="current-password"
                                   placeholder="Введите пароль">
                        </div>

                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label" for="remember">
                                    Запомнить меня
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 py-3 fw-semibold">
                            Войти <i class="bi bi-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
