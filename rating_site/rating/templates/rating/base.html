{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Рейтинг игроков{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <a href="{% url 'home' %}" class="d-inline-flex text-decoration-none">
    <img src="{% static 'img/logo.png' %}" alt="Логотип" style="height: 100px;">
</a>
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
                <span class="fs-4">Рейтинг студентов</span>
            </a>

            <ul class="nav nav-pills">
                <li class="nav-item"><a href="{% url 'home' %}" class="nav-link active" aria-current="page">Главная</a></li>
                <li class="nav-item"><a href="{% url 'rating' %}" class="nav-link">Таблица рейтинга</a></li>
            </ul>
        </header>

        <main>
            {% block content %}
            <!-- Сюда будет подставляться контент из других шаблонов -->
            {% endblock %}
        </main>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            © 2025 Рейтинг студентов
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
