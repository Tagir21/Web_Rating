version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_grades_db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: grades_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: